[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtea2"
version = "2.0.1"
description = "xTea2 — transposable element insertion calling from BAM/CRAM in a single process"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bioinformatics", "transposable-elements", "mobile-element-insertion", "variant-calling"]

# Mirrors envs/xtea2.yml, which is the verified environment. Genotyping (x_genotype_lik) needs
# only numpy and scipy; the ONNX model, onnxruntime, scikit-learn and pandas are gone.
dependencies = [
    "numpy",
    "pysam",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
xtea2 = "xtea.cli:main"
xtea2-genotype = "xtea.x_genotype_lik:main"

[project.urls]
Repository = "https://github.com/corinsexton/xTea"

[tool.setuptools]
# Explicit, not auto-discovered: the repo root also holds `tests/`, `benchmark/` and `src/`, and
# find-packages would otherwise try to install them.
packages = ["xtea"]

[tool.setuptools.package-data]
# `rep_lib_prep/` carries no __init__.py -- it is a data directory inside the package, so its
# contents ship only if named here.
xtea = ["rep_lib_prep/*"]

[tool.pytest.ini_options]
# Kept in sync with pytest.ini, which remains the file pytest actually reads for this repo.
testpaths = ["tests"]
